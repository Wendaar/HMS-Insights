<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HMS · Ukázky nových vrstev</title><link rel="stylesheet" href="styles.css"></head><body><header class="control-header"><div><p class="eyebrow">HMS Broadcast · DEMO</p><h1>Ukázky nových vrstev</h1><p>Smyšlená ukázková data. Tato stránka neovládá žádný OBS kanál.</p></div><a class="button" href="index.html?org=EUCHL">Otevřít testovací ovládání</a></header><main class="demo-workspace"><section class="layer-controls"><label>Vrstva<select id="demo-layer"></select></label><label>Tým<select id="demo-side"><option value="home">North Wolves</option><option value="away">South Falcons</option><option value="both">Oba týmy (góly / partneři)</option></select></label><label>Statistika<select id="demo-metric"><option value="goals">Góly</option><option value="assists">Asistence</option><option value="points">Body</option></select></label><label>Umístění<select id="demo-corner"><option value="bottom-left">Vlevo dole</option><option value="bottom-right">Vpravo dole</option><option value="top-left">Vlevo nahoře</option><option value="top-right">Vpravo nahoře</option></select></label><label>Jazyk<select id="demo-lang"><option value="cs">CZ</option><option value="en">EN</option></select></label><label>Nahrát vlastní QR / logo pouze do ukázky<input id="demo-upload" type="file" accept="image/png,image/jpeg,image/webp"></label></section><p id="demo-note">Partneři se střídají po pěti sekundách. QR obrázek je zástupný; vlastní hotový kód můžete vyzkoušet výběrem souboru.</p><div class="demo-preview"><div id="demo-canvas"></div></div></main><script type="module" src="demo.js"></script></body></html>
