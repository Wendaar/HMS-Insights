<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Stars · HMS</title><link rel="icon" href="/favicon.svg"><link rel="stylesheet" href="/studio/fonts/fonts.css"><link rel="stylesheet" href="/all-stars/app.css"><script type="module" src="/all-stars/app.js"></script></head>
<body><header><a href="/control" id="map-link">HMS · Control</a><span>ALL STARS OF MONTH <b>Beta</b></span><select id="lang" aria-label="Language"><option value="cs">CZ</option><option value="en">EN</option></select></header>
<main><div class="heading"><p class="eyebrow" id="eyebrow"></p><h1 id="heading">All Stars</h1><p id="intro"></p></div><p id="status" role="status"></p>
<section id="manager" hidden><div class="controls"><label><span data-t="organization"></span><select id="org"></select></label><label><span data-t="season"></span><select id="season"></select></label><label><span data-t="month"></span><input id="month" type="month"></label><button id="load" data-t="load"></button></div>
<div class="controls"><label><span data-t="division"></span><select id="group"></select></label><label><span data-t="team"></span><select id="team"></select></label><label><span data-t="search"></span><input id="search" type="search"></label></div>
<section class="quality"><strong id="coverage"></strong><p id="method"></p><details><summary data-t="details"></summary><p id="rules"></p><ul id="missing"></ul></details></section>
<div class="workspace"><section class="nomination-panel"><div class="tabs"><button data-role="F"></button><button data-role="D"></button><button data-role="G"></button></div><p id="candidate-count" aria-live="polite"></p><div id="candidates"></div><button id="more" hidden data-t="more"></button></section><aside class="graphic-panel"><div class="preview-heading"><h2 data-t="selection"></h2><span id="selection-count"></span></div><div class="graphic-controls"><label><span data-t="design"></span><select id="design"></select></label><label><span data-t="template"></span><select id="template"></select></label><label><span data-t="format"></span><select id="format"></select></label><label><span data-t="font"></span><select id="font"></select></label></div><div class="canvas-frame"><canvas id="graphic" width="1920" height="1080" role="img" aria-label="All Stars"></canvas></div><p id="graphic-status" role="status"></p><details id="lineup-details"><summary data-t="editSelection"></summary><div id="lineup"></div></details><button id="clear" data-t="clear"></button><div class="exports"><button id="png" data-t="png"></button><button id="json" data-t="json"></button><label class="file"><span data-t="import"></span><input id="import" type="file" accept="application/json"></label></div></aside></div>
<section class="publication"><h2 data-t="publication"></h2><p id="access-status"></p><div class="controls"><label><span data-t="title"></span><input id="title" maxlength="100"></label><label><span data-t="slug"></span><input id="slug" maxlength="64" placeholder="2026-09-super"></label><label><span data-t="code"></span><input id="code" type="password" autocomplete="off"></label></div><div class="controls"><button id="restore" data-t="restore"></button><button id="save" data-t="save"></button><button id="publish" data-t="publish"></button></div><p id="revision"></p><a id="public-link" target="_blank" rel="noopener noreferrer" hidden></a><textarea id="embed" readonly hidden aria-label="Iframe"></textarea><div id="saved"></div></section>
<p><a href="https://wendaar.github.io/PHM-All-Stars-generator/" target="_blank" rel="noopener noreferrer" data-t="legacy"></a></p></section>
<section id="public-view" hidden><div id="public-graphic-frame" class="canvas-frame" hidden><canvas id="public-graphic" role="img" aria-label="All Stars"></canvas></div><div id="public-lineup"></div><div id="public-list"></div><p id="provenance"></p></section></main></body></html>
